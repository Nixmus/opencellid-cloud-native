name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, ingestor]
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GHCR owner
        id: registry
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.registry.outputs.value }}/cells-${{ matrix.service }}:latest
            ${{ steps.registry.outputs.value }}/cells-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: images
    if: vars.AZURE_READY == 'true'
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      TAG: ${{ github.sha }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_FUNCTION_APP: ${{ vars.AZURE_FUNCTION_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        if: ${{ env.RG != '' && env.AZURE_FUNCTION_APP != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar contenedores
        if: ${{ env.RG != '' && env.AZURE_FUNCTION_APP != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -g "$RG" -n ca-api --image "$REGISTRY/cells-api:$TAG"
          az containerapp update -g "$RG" -n ca-web --image "$REGISTRY/cells-web:$TAG"
          az containerapp job update -g "$RG" -n job-ingestor --image "$REGISTRY/cells-ingestor:$TAG"
      - uses: azure/functions-action@v1
        if: ${{ env.RG != '' && env.AZURE_FUNCTION_APP != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
        with:
          app-name: ${{ env.AZURE_FUNCTION_APP }}
          package: functions/downloader
          sku: flexconsumption
          remote-build: true

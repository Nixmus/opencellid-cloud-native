name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cells
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d cells"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:test@localhost:5432/cells
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt pytest httpx
      - run: psql "$DATABASE_URL" -f db/init.sql
      - run: python -m pytest
        working-directory: services/api

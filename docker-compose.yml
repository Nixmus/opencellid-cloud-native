services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cells
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cells"]
      interval: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/cells
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./services/web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8080:80"

  ingestor:
    build: ./services/ingestor
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/cells
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
